<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharaj Estates & Infra | Build Your Future</title>
    <meta name="description" content="Maharaj Estates & Infra - Luxury Real Estate & Infrastructure Developer. Invest Today in a Better Tomorrow.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Horizontal Luxury Header Bar -->
    <header class="site-header" id="site-header">
        <div class="header-container">
            <!-- Left Logo -->
            <a href="#" class="brand-logo">
                <img src="./assets/logo.png" alt="Maharaj Estates & Infra Logo" class="logo-img">
            </a>

            <!-- Center Navigation -->
            <nav class="center-nav" id="center-nav">
                <ul class="nav-links">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#properties" class="nav-link">Properties</a></li>
                    <li><a href="#about" class="nav-link">About Us</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>

            <!-- Right Actions -->
            <div class="header-right">
                <a href="tel:+918639873123" class="header-phone">
                    <i class="fa-solid fa-phone"></i>
                    <span>+91 8639873123</span>
                </a>
                <button class="btn btn-gold btn-sm" id="enquire-btn">Enquire Now</button>
                <button class="mobile-menu-btn" id="mobile-toggle" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Full-Width Hero Section -->
    <section class="hero-section" id="home">
        <!-- Background Slider -->
        <div class="hero-slider">
            <div class="slide slide-1 active"></div>
            <div class="slide slide-2"></div>
            <div class="slide slide-3"></div>
            <div class="slide slide-4"></div>
        </div>

        <!-- Subtle Left Gradient Overlay -->
        <div class="hero-gradient-overlay"></div>

        <!-- Hero Left Content -->
        <div class="hero-container">
            <div class="hero-text-content">
                <span class="hero-subtext animate-fade-up delay-1">MAHARAJ ESTATES & INFRA</span>
                <h1 class="hero-title animate-fade-up delay-2">Invest Today in a Better Tomorrow.</h1>
                
                <div class="dynamic-tagline-wrapper animate-fade-up delay-3">
                    <p class="dynamic-tagline" id="dynamic-tagline">Find Your Perfect Property.</p>
                </div>

                <div class="hero-cta-buttons animate-fade-up delay-4">
                    <a href="#properties" class="btn btn-gold">Explore Properties</a>
                    <a href="#contact" class="btn btn-outline-white">Contact Us</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Enquire Modal Popup -->
    <div class="modal" id="enquire-modal">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-header">
                <h3>Quick Enquiry</h3>
                <p>Speak with Maharaj Estates Senior Real Estate Consultant</p>
            </div>
            <form id="enquiry-form" class="modal-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="modal-name" class="form-input" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="modal-phone" class="form-input" placeholder="+91 8639873123" required>
                </div>
                <div class="form-group">
                    <label>Interest</label>
                    <select id="modal-interest" class="form-select">
                        <option value="Luxury Villas">Luxury Sky Villas & Mansions</option>
                        <option value="Integrated Townships">Gated Integrated Townships</option>
                        <option value="Commercial Projects">Grade-A Commercial Office Towers</option>
                        <option value="Infra & Land">Land & Infra Joint Ventures</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-gold btn-full">Submit Request</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Main JS -->
    <script src="app.js"></script>
</body>
</html>
